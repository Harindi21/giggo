name: PR Checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Commit message format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0        # need full history to check every commit in the PR
      - uses: wagoid/commitlint-github-action@v6