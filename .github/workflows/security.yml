name: Security

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0        # full history, so it can scan past commits too
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE needed — this is a personal account, so it's free.

  vuln-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs         # scan the files/dependencies in the repo
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true  # ignore vulns that have no fix available yet
          exit-code: '1'        # fail the check if a HIGH/CRITICAL is found