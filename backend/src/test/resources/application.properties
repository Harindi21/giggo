# Use an in-memory H2 database for tests (no Docker/Postgres needed)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema for tests; skip Flyway
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Dummy values so JwtProperties etc. load
giggo.jwt.secret=dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtMDEyMzQ1Ng==
giggo.jwt.expiration-minutes=15
giggo.jwt.refresh-expiration-days=30