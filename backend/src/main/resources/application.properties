spring.application.name=backend

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/giggo
spring.datasource.username=giggo
spring.datasource.password=giggo_local_dev

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

server.port=${PORT:8080}

server.forward-headers-strategy=framework

# sentry-related
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENV:local}
sentry.send-default-pii=false
sentry.traces-sample-rate=0.1

giggo.email.provider=${EMAIL_PROVIDER:log}

# Local showcase only: seed demo providers on startup. Never enable in production.
giggo.seed.demo-data=${SEED_DEMO_DATA:false}

# Dynamic pricing: travel fee charged per kilometre (LKR).
giggo.pricing.travel-fee-per-km=${TRAVEL_FEE_PER_KM:50}

# Real-time tracking: fallback average speed (km/h) for ETA when live speed is unknown.
giggo.tracking.average-speed-kmh=${TRACKING_AVG_SPEED_KMH:25}

# NLP microservice (P6.2) used to score review text.
giggo.ml.base-url=${ML_BASE_URL:http://localhost:8000}
giggo.ml.api-key=${ML_API_KEY:local-dev-key}

# Enhanced rating = stars*star-weight + text-sentiment-stars*text-weight.
giggo.rating.star-weight=${RATING_STAR_WEIGHT:0.6}
giggo.rating.text-weight=${RATING_TEXT_WEIGHT:0.4}

# Bayesian composite rating (IMDb-style): prior (neutral anchor) and smoothing m.
giggo.rating.bayesian-prior=${RATING_BAYESIAN_PRIOR:3.0}
giggo.rating.bayesian-smoothing=${RATING_BAYESIAN_SMOOTHING:5}

# Fair ranking: ensure the top N results span at least this many districts.
giggo.ranking.fair-window=${RANKING_FAIR_WINDOW:10}
giggo.ranking.fair-min-districts=${RANKING_FAIR_MIN_DISTRICTS:3}

giggo.jwt.secret=${JWT_SECRET:ZmFrZS1sb2NhbC1kZXYtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
giggo.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
giggo.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
